name: MapGrapherIOS
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MapGrapherCore:
    path: Packages/MapGrapherCore
targets:
  MapGrapherIOS:
    type: application
    platform: iOS
    sources:
      - path: MapGrapherIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakugakimap.ios.development
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RakugakiMap
        INFOPLIST_KEY_NSCameraUsageDescription: 現地でラクガキをAR表示するためにカメラを使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    dependencies:
      - package: MapGrapherCore
  MapGrapherIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MapGrapherIOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakugakimap.ios.development.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MapGrapherIOS
  MapGrapherIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MapGrapherIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakugakimap.ios.development.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MapGrapherIOS
schemes:
  MapGrapherIOS:
    build:
      targets:
        MapGrapherIOS: all
    test:
      gatherCoverageData: true
      targets:
        - MapGrapherIOSTests
        - MapGrapherIOSUITests
