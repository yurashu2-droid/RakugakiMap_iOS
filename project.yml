name: MapGrapherIOS
options:
  developmentLanguage: ja
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MapGrapherCore:
    path: Packages/MapGrapherCore
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.2
targets:
  MapGrapherIOS:
    type: application
    platform: iOS
    info:
      path: MapGrapherIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: RakugakiMap
        NSCameraUsageDescription: 現地でラクガキをAR表示し、端末を動かして空間に描くためにカメラを使います。
        NSLocationWhenInUseUsageDescription: 近くの写真と現地のAR作品を探すために位置情報を使います。
        NSPhotoLibraryUsageDescription: 投稿に使う写真を選ぶために写真ライブラリを使います。
        NSPhotoLibraryAddUsageDescription: 共有メニューで選んだAR写真を写真ライブラリに保存します。
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.rakugakimap.auth
            CFBundleURLSchemes:
              - rakugakimap-dev
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    configFiles:
      Debug: MapGrapherIOS/Configuration/Base.xcconfig
      Release: MapGrapherIOS/Configuration/Base.xcconfig
    sources:
      - path: MapGrapherIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_ENTITLEMENTS: MapGrapherIOS/Resources/MapGrapherIOS.entitlements
    dependencies:
      - package: MapGrapherCore
      - package: Supabase
        product: Supabase
  MapGrapherIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MapGrapherIOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakugakimap.ios.development.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MapGrapherIOS
  MapGrapherIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MapGrapherIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakugakimap.ios.development.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MapGrapherIOS
schemes:
  MapGrapherIOS:
    build:
      targets:
        MapGrapherIOS: all
    test:
      gatherCoverageData: true
      targets:
        - MapGrapherIOSTests
  MapGrapherIOSUI:
    build:
      targets:
        MapGrapherIOS: all
    test:
      targets:
        - MapGrapherIOSUITests
