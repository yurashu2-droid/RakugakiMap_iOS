name: iOS verification

on:
  push:
    paths:
      - 'Packages/**'
      - 'MapGrapherIOS/**'
      - 'MapGrapherIOSTests/**'
      - 'MapGrapherIOSUITests/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'Packages/**'
      - 'MapGrapherIOS/**'
      - 'MapGrapherIOSTests/**'
      - 'MapGrapherIOSUITests/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests
        run: swift test --package-path Packages/MapGrapherCore
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test backend configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/configure-ci-backend.sh
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build/tools/XcodeGen
          key: xcodegen-2.44.1-xcode-16.4-${{ runner.os }}
      - name: Generate project
        run: bash scripts/generate-project.sh
      - name: Unsigned device build
        run: bash scripts/verify-ios.sh build
      - name: Select simulator
        id: simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for x in d["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-18-5", []) if "iPhone" in x["name"]))')
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Unit tests
        run: bash scripts/verify-ios.sh unit
      - name: UI tests
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: bash scripts/verify-ios.sh ui
      - name: Export UI screenshots
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: |
          for result in .build/verification/*/ui.xcresult; do
            if [[ -d "$result" ]]; then
              xcrun xcresulttool export attachments --path "$result" --output-path .build/verification/ui-attachments
            fi
          done
      - name: Test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-test-results
          path: .build/verification
          if-no-files-found: ignore
          retention-days: 7
  ipa:
    needs: [core, ios]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test backend configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/configure-ci-backend.sh
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build/tools/XcodeGen
          key: xcodegen-2.44.1-xcode-16.4-${{ runner.os }}
      - name: Package unsigned IPA
        run: bash scripts/package-ipa.sh
      - name: iLoader IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: RakugakiMap-unsigned-ipa
          path: .build/ipa-output
          if-no-files-found: error
          retention-days: 14
